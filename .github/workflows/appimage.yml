
on:
 workflow_dispatch:
  inputs:
   ppa:
    description: "ppa sufix"
   frefresh:
    description: "Force refresh even when ./src or ant already exist"
    type: boolean
    default: false

jobs:
 build:
  runs-on: ubuntu-24.04 #also at downdeb
  steps:
   - name: Check for existing source directory
     id: src
     run: |
      if [ -d ./src ]; then
       echo "exists=true" >> "$GITHUB_OUTPUT"
      else
       echo "exists=false" >> "$GITHUB_OUTPUT"
      fi
   - uses: actions/checkout@master
     if: steps.src.outputs.exists != 'true' || inputs.frefresh
   - name: Install build dependencies
     run: |
      if ! command -v ant || [ "${{ inputs.frefresh }}" = "true" ]; then
       deps='ant default-jre libjna-java libjna-platform-java libjavassist-java squashfs-tools'
       if [ "$(id -u)" -eq 0 ]; then
        apt-get update
        apt-get install -y ${deps}
       else
        sudo apt-get update
        sudo apt-get install -y ${deps}
       fi
      fi
   - name: Run a multi-line script
     run: |
      run=runtime
      if [ ! -e "${run}" ]; then
       archfile=runtime-x86_64
       wget -c https://github.com/AppImage/type2-runtime/releases/download/continuous/${archfile}
       mv ${archfile} ${run}
      fi

      name=flashalizer
      name2=Flashalizer

      ant compile

      apd=AppDir
      mkdir -p ${apd}
      shr=${apd}/usr/share
      mkdir -p ${shr}
      fshr=${shr}/${name}
      if [ ! -e ${fshr} ]; then
       mkdir ${fshr}
       cp -av build/. ${fshr}/
       cp -av img ${fshr}/
      fi
      jshr=${shr}/java
      if [ ! -e ${jshr} ]; then
       mkdir -p ${jshr}
       cp -avL /usr/share/java/jna.jar /usr/share/java/jna-platform.jar /usr/share/java/javassist.jar ${jshr}/
      fi
      jav=${apd}/usr/lib/jvm
      if [ ! -x ${jav}/default-java/bin/java ]; then
       mkdir -p ${jav}
       cp -avL "$(readlink -f /usr/lib/jvm/default-java)" ${jav}/default-java
      fi

      cd ${apd}
      file=AppRun
      if [ ! -e "${file}" ]; then
       echo launcher
       cat > ${file} <<EOF
      #!/bin/sh
      root_dir="\$(readlink -f "\$(dirname "\$0")"/usr)"
      exec "\${root_dir}"/lib/jvm/default-java/bin/java --add-opens=java.base/java.lang=ALL-UNNAMED -cp "\${root_dir}"/share/${name}:"\${root_dir}"/share/java/jna.jar:"\${root_dir}"/share/java/jna-platform.jar:"\${root_dir}"/share/java/javassist.jar ${name} "\$@"
      EOF
       chmod 755 ${file}
      fi

      pngfile=${name}.png
      if [ ! -e "${pngfile}" ]; then
      #.DirIcon must be a PNG for the AppDir convention. Use a standard icon size such as 128x128 or 256x256 pixels. A JPG can still be used as your app's source image, but convert it to PNG for .DirIcon.
       echo pngfile
       wget https://github.com/colin-i/test/releases/download/1.5/${name}.png -O ${pngfile}
       cat > ${name}.desktop <<EOF
      [Desktop Entry]
      Type=Application
      Name=${name2}
      Exec=${name}
      Icon=${name}
      Categories=Utility
      EOF
       ln -s ${pngfile} .DirIcon
      fi

      #metadata file
      mi=usr/share/metainfo
      mif=${mi}/com.colin.${name}.appdata.xml
      if [ ! -e "${mif}" ]; then
       echo metadata
       mkdir -p ${mi}
       cat > ${mif} <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <!-- Copyright 2026 -->
      <component type="desktop-application">
       <id>com.colin.${name}</id>
       <metadata_license>FSFAP</metadata_license>
       <name>${name2}</name>
       <summary>Make .swf files</summary>
       <description>
        <ul>
         <li>Use ActionSwf to make .swf files</li>
         <li>Edit .xml projects</li>
         <li>Edit shapes, buttons</li>
        </ul>
       </description>
       <url type="homepage">https://www.github.com/colin-i/${name}</url>
       <screenshots>
        <screenshot type="default">
         <caption>${name2} image</caption>
         <image>https://drive.google.com/open?id=1C1cCOCPH8S_PhxsPHewIyNgUv4kKg-lz</image>
        </screenshot>
       </screenshots>
       <content_rating/>
      </component>
      EOF
      fi

      cd ..
      if [ ! -e "${name}.AppImage" ]; then
       mksquashfs ${apd} ${name}.squashfs -root-owned -noappend
       cat ${run} > ${name}.AppImage
       cat ${name}.squashfs >> ${name}.AppImage
       chmod a+x ${name}.AppImage
      fi
